openapi: 3.0.3
info:
  title: OpenREL KB API
  version: 0.4.0
  description: API for accessing OpenREL knowledge base vocabulary sources. RDF-backed endpoints return Turtle (text/turtle) by default; application/json and application/ld+json are alternative representations.
tags:
  - name: Class Instances
    description: ""
  - name: ODRL Classes
    description: ""
  - name: ODRL Individuals
    description: ""
  - name: Policy Index
    description: ""
  - name: Indexing
    description: ""
  - name: Mappings
    description: ""
  - name: Classes
    description: ""
paths:
  /openrel/api/v0.4/actions:
    get:
      tags:
        - Class Instances
      summary: List Actions
      description: "Lists all members of the Actions source file (IRI, label, definition)"
      parameters:
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: Filter by compact identifier prefix
        - name: format
          in: query
          required: false
          schema:
            type: string
            default: ttl
            enum:
              - ttl
              - json
              - json-ld
          description: Response representation. ttl (RDF Turtle) is native and the default; json and json-ld are alternatives. The Accept header is honoured as well.
      responses:
        '200':
          description: Successful response
          content:
            text/turtle:
              description: Native default representation (RDF Turtle)
              schema:
                type: string
            application/ld+json:
              description: JSON-LD alternative (Accept: application/ld+json, or ?format=json-ld)
              schema:
                type: object
            application/json:
              description: Plain JSON alternative (Accept: application/json, or ?format=json)
              schema:
                type: array
                items:
                  type: object
                  properties:
                    iri:
                      type: string
                    label:
                      type: string
                    definition:
                      type: string
